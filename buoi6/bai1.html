<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Bài 1 - Thẻ sinh viên</title>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <style>
        .gioi { color: green; font-weight: bold; }
        .kha { color: blue; font-weight: bold; }
        .tb { color: orange; font-weight: bold; }
        .yeu { color: red; font-weight: bold; }
    </style>
</head>
<body>
    <div id="app">
        <h2>Thẻ Thông Tin Sinh Viên</h2>
        <img :src="student.avatar" :alt="student.name" width="150" height="150"><br>
        <p><strong>Mã SV:</strong> {{ student.id }}</p>
        <p><strong>Họ tên:</strong> {{ student.name }}</p>
        <p><strong>Lớp:</strong> <span v-text="student.className"></span></p>
        
        <p><strong>Điểm TB:</strong> {{ student.gpa }} 
            - Xếp loại: 
            <span :class="rankingClass">{{ rankingText }}</span>
        </p>
        
        <p><strong>Trạng thái:</strong> {{ student.isActive ? 'Đang học' : 'Đã nghỉ' }}</p>
        
        <button @click="showIntro = !showIntro">Bật/tắt giới thiệu</button>
        <p v-show="showIntro" style="margin-top: 10px; font-style: italic;">
            Xin chào, tôi là {{ student.name }}, sinh viên lớp {{ student.className }}.
        </p>
    </div>

    <script>
        const { createApp } = Vue;
        createApp({
            data() {
                return {
                    student: {
                        id: 'SV001',
                        name: 'Nguyễn Văn A',
                        className: 'K68A3',
                        avatar: 'https://via.placeholder.com/150',
                        gpa: 8.5,
                        isActive: true
                    },
                    showIntro: false
                }
            },
            computed: {
                rankingText() {
                    const gpa = this.student.gpa;
                    if (gpa >= 8 && gpa <= 10) return 'Giỏi';
                    if (gpa >= 6.5 && gpa < 8) return 'Khá';
                    if (gpa >= 5 && gpa < 6.5) return 'Trung bình';
                    return 'Chưa đạt';
                },
                rankingClass() {
                    const gpa = this.student.gpa;
                    if (gpa >= 8) return 'gioi';
                    if (gpa >= 6.5) return 'kha';
                    if (gpa >= 5) return 'tb';
                    return 'yeu';
                }
            }
        }).mount('#app');
    </script>
</body>
</html>
