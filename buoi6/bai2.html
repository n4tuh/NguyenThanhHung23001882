<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Bài 2 - Đặt vé xem phim</title>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
</head>
<body>
    <div id="app">
        <h2>Đặt Vé Xem Phim</h2>
        <form @submit.prevent="submitForm">
            <div>
                <label>Họ tên:</label>
                <input type="text" v-model.trim="customerName">
            </div>
            
            <div>
                <label>Suất chiếu:</label>
                <select v-model="showtime">
                    <option value="18:00">18:00</option>
                    <option value="20:00">20:00</option>
                    <option value="22:00">22:00</option>
                </select>
            </div>
            
            <div>
                <label>Loại vé:</label>
                <input type="radio" value="70000" v-model="ticketPrice"> Vé thường (70.000đ)
                <input type="radio" value="100000" v-model="ticketPrice"> Vé VIP (100.000đ)
            </div>
            
            <div>
                <label>Số lượng (1-10):</label>
                <button type="button" @click="quantity > 1 ? quantity-- : null">-</button>
                <input type="number" v-model.number="quantity" min="1" max="10">
                <button type="button" @click="quantity < 10 ? quantity++ : null">+</button>
            </div>
            
            <div>
                <input type="checkbox" v-model="hasCombo"> Thêm combo bắp nước (45.000đ)
            </div>
            
            <p><strong>Tổng tiền: {{ totalAmount.toLocaleString() }} đồng</strong></p>
            
            <button type="submit" :disabled="!isValid">Đặt vé</button>
            <button type="button" @click="resetForm">Đặt lại</button>
        </form>

        <div v-if="orderConfirmed" style="margin-top:20px; color: green;">
            <h3>Xác nhận đơn hàng:</h3>
            <p>Khách hàng: {{ customerName }}</p>
            <p>Tổng thanh toán: {{ totalAmount.toLocaleString() }} đồng</p>
        </div>
    </div>

    <script>
        const { createApp } = Vue;
        createApp({
            data() {
                return {
                    customerName: '',
                    showtime: '20:00',
                    ticketPrice: '70000',
                    quantity: 1,
                    hasCombo: false,
                    orderConfirmed: false
                }
            },
            computed: {
                totalAmount() {
                    let total = parseInt(this.ticketPrice) * this.quantity;
                    if (this.hasCombo) total += 45000;
                    return total;
                },
                isValid() {
                    return this.customerName !== '' && this.quantity >= 1 && this.quantity <= 10;
                }
            },
            methods: {
                resetForm() {
                    this.customerName = '';
                    this.showtime = '20:00';
                    this.ticketPrice = '70000';
                    this.quantity = 1;
                    this.hasCombo = false;
                    this.orderConfirmed = false;
                },
                submitForm() {
                    this.orderConfirmed = true;
                }
            }
        }).mount('#app');
    </script>
</body>
</html>
